<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Sting Smashers logo, animated">
  <style>
    .r{transform-box:fill-box;transform-origin:50% 100%;animation:r 3.6s cubic-bezier(.5,0,.2,1) infinite}
    @keyframes r{0%{transform:rotate(0)}26%{transform:rotate(-30deg)}29%{transform:rotate(22deg)}33%{transform:rotate(12deg)}50%,100%{transform:rotate(0)}}
    .bolt{animation:bolt 3.6s linear infinite}
    @keyframes bolt{0%,28%{opacity:.12}29.5%,36%{opacity:1}46%,100%{opacity:.12}}
    .b{transform-box:fill-box;transform-origin:50% 50%;animation:b 3.6s linear infinite}
    @keyframes b{0%,4%{transform:translate(-62px,-110px) scale(.7);opacity:0}10%{transform:translate(-62px,-102px) scale(1);opacity:1}26%{transform:translate(-62px,-92px)}28.5%{transform:translate(-62px,-92px)}31%{transform:translate(0,0) scale(1.25,.7)}32.5%{transform:translate(0,-40px) scale(.95,1.1)}36%{transform:translate(0,-110px) scale(1)}37%{transform:translate(0,-114px) scale(.6)}39%{transform:translate(0,-116px) scale(1.15)}41%{transform:translate(-8px,-118px) scale(1)}48%{transform:translate(-38px,-128px)}55%{transform:translate(-64px,-106px)}62%{transform:translate(-40px,-132px)}69%{transform:translate(-14px,-108px)}76%{transform:translate(-46px,-120px);opacity:1}84%{transform:translate(20px,-190px) scale(.8);opacity:1}90%,100%{transform:translate(60px,-250px) scale(.6);opacity:0}}
    .ball{animation:ball 3.6s linear infinite}
    @keyframes ball{0%,36.5%{opacity:1}37%,99%{opacity:0}100%{opacity:1}}
    .bee{animation:bee 3.6s linear infinite;opacity:0}
    @keyframes bee{0%,36.5%{opacity:0}37%,99%{opacity:1}100%{opacity:0}}
    .wing{transform-box:fill-box;transform-origin:50% 100%;animation:wing .12s ease-in-out infinite alternate}
    @keyframes wing{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
    .imp{animation:imp 3.6s linear infinite}
    @keyframes imp{0%,30.5%{opacity:0}31.5%{opacity:1}39%,100%{opacity:0}}
    .st{animation:st 3.6s linear infinite;opacity:0}
    @keyframes st{0%,31.5%{opacity:0}33%{opacity:.85}37.5%,100%{opacity:0}}
    .pop{animation:pop 3.6s linear infinite;opacity:0}
    @keyframes pop{0%,36.5%{opacity:0}37.5%{opacity:1}41%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.st,.imp,.bee,.pop{opacity:0}.bolt{opacity:1}}
  </style>
  <defs>
    <g id="h"><circle cx="-16" cy="-24" r="4.4"/><circle cx="0" cy="-24" r="4.4"/><circle cx="16" cy="-24" r="4.4"/><circle cx="-24" cy="-8" r="4.4"/><circle cx="-8" cy="-8" r="4.4"/><circle cx="8" cy="-8" r="4.4"/><circle cx="24" cy="-8" r="4.4"/><circle cx="-16" cy="8" r="4.4"/><circle cx="0" cy="8" r="4.4"/><circle cx="16" cy="8" r="4.4"/><circle cx="-8" cy="24" r="4.4"/><circle cx="8" cy="24" r="4.4"/></g>
    <path id="arc" d="M34 120 A86 86 0 0 0 206 120" fill="none"/>
    <clipPath id="clip"><circle cx="120" cy="120" r="104"/></clipPath>
  </defs>
  <circle cx="120" cy="120" r="116" fill="#1b1b1b"/>
  <g clip-path="url(#clip)"><g transform="translate(30 16) scale(0.75)">
    <g stroke="#f5c400" stroke-width="3.5" stroke-linecap="round" opacity=".55" fill="none"><path d="M38 96 C40 70 52 50 70 38"/><path d="M50 104 C52 82 62 64 78 54"/></g>
    <g class="r"><g transform="rotate(-35 86 82)">
      <ellipse cx="86" cy="66" rx="34" ry="40" fill="#f5c400" stroke="#0d0d0d" stroke-width="3"/>
      <ellipse cx="86" cy="66" rx="27" ry="33" fill="none" stroke="#c99f00" stroke-width="2"/>
      <g fill="#1b1b1b" transform="translate(86 66) scale(1.05)"><use href="#h"/></g>
      <path d="M74 104 L98 104 L93 116 L79 116 Z" fill="#f5c400" stroke="#0d0d0d" stroke-width="3"/>
      <rect x="79" y="114" width="14" height="46" rx="5" fill="#f5c400" stroke="#0d0d0d" stroke-width="3"/>
      <path d="M79 126 L93 132 M79 138 L93 144 M79 150 L93 156" stroke="#1b1b1b" stroke-width="2.5"/>
    </g></g>
    <polygon class="bolt" points="134,58 108,114 130,114 112,170 168,96 142,96 160,58" fill="#fff" stroke="#f5c400" stroke-width="4" stroke-linejoin="round"/>
    <g class="st" stroke="#f5c400" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"><path d="M160 150 L160 -20"/><path d="M180 150 L180 -20"/></g>
    <g transform="translate(170 150)"><g class="b">
      <g class="ball"><circle r="19" fill="#d7f34a" stroke="#0d0d0d" stroke-width="3"/><path d="M-17 -7 C-6 1 6 1 17 -7 M-17 7 C-6 -1 6 -1 17 7" fill="none" stroke="#fff" stroke-width="3"/></g>
      <g class="bee">
        <g transform="translate(-9 -14)"><ellipse class="wing" cx="0" cy="-8" rx="9" ry="13" fill="#e9f4fb" stroke="#0d0d0d" stroke-width="2" opacity=".95"/></g>
        <g transform="translate(9 -14)"><ellipse class="wing" cx="0" cy="-8" rx="9" ry="13" fill="#e9f4fb" stroke="#0d0d0d" stroke-width="2" opacity=".95"/></g>
        <ellipse rx="17" ry="21" fill="#f5c400" stroke="#0d0d0d" stroke-width="3"/>
        <path d="M-16 -4 L16 -4 M-15 6 L15 6" stroke="#0d0d0d" stroke-width="6"/>
        <polygon points="-5,20 5,20 0,31" fill="#0d0d0d"/>
        <circle cy="-20" r="9" fill="#0d0d0d"/><circle cx="-3.5" cy="-22" r="2" fill="#fff"/><circle cx="3.5" cy="-22" r="2" fill="#fff"/>
        <path d="M-4 -28 C-8 -36 -12 -36 -14 -34 M4 -28 C8 -36 12 -36 14 -34" fill="none" stroke="#0d0d0d" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </g></g>
    <g class="pop" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M170 18 L170 6 M186 26 L196 18 M154 26 L144 18 M188 44 L200 46 M152 44 L140 46"/></g>
    <g class="imp" stroke="#f5c400" stroke-width="4" stroke-linecap="round"><path d="M150 178 L140 186"/><path d="M164 182 L160 194"/><path d="M180 182 L184 194"/><path d="M192 176 L202 184"/></g>
  </g></g>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#f5c400" stroke-width="3"/>
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="#dcdcdc"><textPath href="#arc" startOffset="50%" text-anchor="middle">STING SMASHERS</textPath></text>
</svg>
