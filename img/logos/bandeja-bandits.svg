<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Bandeja Bandits logo">
<style>
*{animation-delay:-1.72s!important;animation-play-state:paused!important}
.arm{transform-box:view-box;transform-origin:60px 100px;animation:arm 3.2s cubic-bezier(.5,0,.3,1) infinite}
@keyframes arm{0%{transform:rotate(-5deg) scale(.85)}30%,46%{transform:rotate(-8deg) scale(.85)}52%{transform:rotate(35deg) scale(.85)}60%{transform:rotate(80deg) scale(.85)}75%{transform:rotate(70deg) scale(.85)}100%{transform:rotate(-5deg) scale(.85)}}
.ball{animation:ball 3.2s linear infinite}
@keyframes ball{0%{transform:translate(100px,-60px);opacity:0}8%{transform:translate(90px,-50px);opacity:1}30%{transform:translate(50px,-34px)}46%{transform:translate(14px,-10px)}52%{transform:translate(0,0);opacity:1}52.5%,100%{transform:translate(0,0);opacity:0}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.out{offset-path:path("M104 46 C130 70 150 110 160 140 C168 160 196 168 210 172 L250 172");offset-rotate:0deg;animation:out 3.2s linear infinite;opacity:0}
@keyframes out{0%,52%{offset-distance:0%;opacity:0}52.5%{offset-distance:0%;opacity:1}62%{offset-distance:38%}70%{offset-distance:66%}76%{offset-distance:82%;opacity:1}84%{offset-distance:96%;opacity:1}88%,100%{offset-distance:100%;opacity:0}}
.hit{animation:hit 3.2s linear infinite;opacity:0}@keyframes hit{0%,51%{opacity:0}53%{opacity:1}60%,100%{opacity:0}}
.trail{animation:trail 3.2s linear infinite;opacity:0}@keyframes trail{0%,53%{opacity:0}62%{opacity:.85}82%{opacity:.5}90%,100%{opacity:0}}
.tail{transform-box:fill-box;transform-origin:0% 50%;animation:tail .5s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.offarm{transform-box:view-box;transform-origin:76px 100px;animation:off 3.2s ease-in-out infinite}
@keyframes off{0%,8%{transform:rotate(30deg)}22%,50%{transform:rotate(0deg)}58%,80%{transform:rotate(60deg)}100%{transform:rotate(30deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.hit,.trail{opacity:0}}
</style>
<defs>
<g id="h"><circle cx="-8" cy="-10" r="2.6"/><circle cx="0" cy="-10" r="2.6"/><circle cx="8" cy="-10" r="2.6"/><circle cx="-10" cy="-2" r="2.6"/><circle cx="-3" cy="-2" r="2.6"/><circle cx="3" cy="-2" r="2.6"/><circle cx="10" cy="-2" r="2.6"/><circle cx="-7" cy="6" r="2.6"/><circle cx="0" cy="6" r="2.6"/><circle cx="7" cy="6" r="2.6"/><circle cx="-3" cy="13" r="2.6"/><circle cx="3" cy="13" r="2.6"/></g>
<path id="arc" d="M30 120 A90 90 0 0 0 210 120" fill="none"/>
<clipPath id="clip"><circle cx="120" cy="120" r="104"/></clipPath>
</defs>
<circle cx="120" cy="120" r="116" fill="#2b1a10"/>
<g clip-path="url(#clip)"><g transform="translate(16 -14)">
<rect x="-20" y="174" width="280" height="80" fill="#1e5aa8"/><path d="M-20 174 L260 174" stroke="#f2e2c0" stroke-width="2.5"/>
<g><rect x="152" y="146" width="4" height="28" fill="#9aa3ad"/><rect x="156" y="148" width="2" height="26" fill="#f2e2c0" opacity=".5"/><path d="M152 146 L160 146" stroke="#f2e2c0" stroke-width="3"/></g>
<path class="trail" d="M104 46 C130 70 150 110 160 140 C168 160 196 168 210 172 L236 172" fill="none" stroke="#e0a030" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round"/>
<!-- player -->
<path d="M66 136 L52 172 M66 136 L86 172" stroke="#111" stroke-width="10" stroke-linecap="round"/>
<path d="M68 96 L66 136" stroke="#c0392b" stroke-width="16" stroke-linecap="round"/>
<g class="offarm"><path d="M76 100 L84 62" stroke="#111" stroke-width="7" stroke-linecap="round"/></g>
<g class="arm"><path d="M60 100 L60 74" stroke="#111" stroke-width="7" stroke-linecap="round"/>
<rect x="57" y="54" width="6" height="22" rx="2" fill="#c0392b" stroke="#000" stroke-width="1.5"/>
<ellipse cx="60" cy="42" rx="15" ry="18" fill="#e9edf1" stroke="#000" stroke-width="2.5"/><g fill="#2b1a10" transform="translate(60 42)"><use href="#h"/></g></g>
<circle cx="66" cy="84" r="12" fill="#c8a27e" stroke="#111" stroke-width="2.5"/>
<path d="M54 80 L78 80 L78 88 L54 88Z" fill="#111"/><circle cx="62" cy="84" r="2" fill="#fff"/><circle cx="71" cy="84" r="2" fill="#fff"/>
<path d="M54 76 C56 68 76 68 78 76 L78 78 L54 78Z" fill="#c0392b"/>
<path class="tail" d="M54 78 L40 74 L44 80 L38 84Z" fill="#c0392b"/>
<g class="hit" stroke="#e0a030" stroke-width="3" stroke-linecap="round"><path d="M112 34 L120 26 M116 48 L128 48 M108 26 L108 14"/></g>
<g class="out"><g class="spin"><circle r="9" fill="#d7f34a" stroke="#111" stroke-width="2"/><path d="M-8 -3 C-3 1 3 1 8 -3 M-8 3 C-3 -1 3 -1 8 3" fill="none" stroke="#fff" stroke-width="1.6"/></g></g>
<g class="ball"><g transform="translate(104 46)"><g class="spin"><circle r="9" fill="#d7f34a" stroke="#111" stroke-width="2"/><path d="M-8 -3 C-3 1 3 1 8 -3 M-8 3 C-3 -1 3 -1 8 3" fill="none" stroke="#fff" stroke-width="1.6"/></g></g></g>
</g></g>
<circle cx="120" cy="120" r="106" fill="none" stroke="#e0a030" stroke-width="3"/>
<text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="2" fill="#f2e2c0"><textPath href="#arc" startOffset="50%" text-anchor="middle">BANDEJA BANDITS</textPath></text>
</svg>