<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Mavericks logo">
<style>
*{animation-delay:-1.75s!important;animation-play-state:paused!important}
.rl{transform-box:view-box;transform-origin:56px 160px;animation:rl 3.2s cubic-bezier(.5,0,.3,1) infinite}
.rr{transform-box:view-box;transform-origin:184px 160px;animation:rr 3.2s cubic-bezier(.5,0,.3,1) infinite}
@keyframes rl{0%,14%{transform:rotate(0)}24%{transform:rotate(-14deg)}30%{transform:rotate(16deg)}34%{transform:rotate(8deg)}46%,100%{transform:rotate(0)}}
@keyframes rr{0%,14%{transform:rotate(0)}24%{transform:rotate(14deg)}30%{transform:rotate(-16deg)}34%{transform:rotate(-8deg)}46%,100%{transform:rotate(0)}}
.clash{animation:clash 3.2s linear infinite;opacity:0}
@keyframes clash{0%,29%{opacity:0}30.5%{opacity:1}38%,100%{opacity:0}}
.ball{transform-box:fill-box;transform-origin:50% 50%;animation:ball 3.2s cubic-bezier(.3,0,.5,1) infinite}
@keyframes ball{0%,30%{transform:translateY(0)}31%{transform:translateY(2px) scale(1.2,.8)}40%{transform:translateY(-34px)}50%{transform:translateY(0) scale(1.15,.85)}54%{transform:translateY(-10px)}58%,100%{transform:translateY(0)}}
.head{transform-box:view-box;transform-origin:120px 120px;animation:head 3.2s ease-in-out infinite}
@keyframes head{0%,40%,80%,100%{transform:none}48%{transform:translateY(4px) scale(1.04)}62%{transform:translateY(3px) scale(1.04)}}
.eye{animation:eye 3.2s linear infinite}
@keyframes eye{0%,44%{fill:#f5c400}48%,62%{fill:#fff8d0}66%,100%{fill:#f5c400}}
.glow{animation:glow 3.2s linear infinite;opacity:0}
@keyframes glow{0%,44%{opacity:0}48%,62%{opacity:.9}68%,100%{opacity:0}}
.jaw{transform-box:view-box;transform-origin:120px 130px;animation:jaw 3.2s ease-in-out infinite}
@keyframes jaw{0%,44%{transform:none}50%,62%{transform:translateY(7px)}70%,100%{transform:none}}
.fang{animation:fang 3.2s linear infinite;opacity:0}
@keyframes fang{0%,45%{opacity:0}49%,63%{opacity:1}68%,100%{opacity:0}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 3.2s ease-in-out infinite}
@keyframes ear{0%,64%,100%{transform:rotate(0)}68%{transform:rotate(-10deg)}72%{transform:rotate(4deg)}76%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.clash,.glow,.fang{opacity:0}}
</style>
<defs>
<g id="h"><circle cx="-16" cy="-24" r="4.3"/><circle cx="0" cy="-24" r="4.3"/><circle cx="16" cy="-24" r="4.3"/><circle cx="-24" cy="-8" r="4.3"/><circle cx="-8" cy="-8" r="4.3"/><circle cx="8" cy="-8" r="4.3"/><circle cx="24" cy="-8" r="4.3"/><circle cx="-16" cy="8" r="4.3"/><circle cx="0" cy="8" r="4.3"/><circle cx="16" cy="8" r="4.3"/><circle cx="-8" cy="24" r="4.3"/><circle cx="8" cy="24" r="4.3"/></g>
<path id="arc" d="M34 120 A86 86 0 0 0 206 120" fill="none"/>
<clipPath id="clip"><circle cx="120" cy="120" r="104"/></clipPath>
</defs>
<circle cx="120" cy="120" r="116" fill="#1a1d22"/>
<g clip-path="url(#clip)">
<g class="rl"><g transform="translate(70 128) rotate(-40)"><ellipse rx="20" ry="24" fill="#e9edf1" stroke="#000" stroke-width="2.5"/><g fill="#1a1d22" transform="scale(.7)"><use href="#h"/></g><rect x="-5" y="23" width="10" height="30" rx="3" fill="#e9edf1" stroke="#000" stroke-width="2"/></g></g>
<g class="rr"><g transform="translate(170 128) rotate(40)"><ellipse rx="20" ry="24" fill="#e9edf1" stroke="#000" stroke-width="2.5"/><g fill="#1a1d22" transform="scale(.7)"><use href="#h"/></g><rect x="-5" y="23" width="10" height="30" rx="3" fill="#e9edf1" stroke="#000" stroke-width="2"/></g></g>
<g class="clash" stroke="#f5c400" stroke-width="3" stroke-linecap="round"><path d="M60 92 L50 82 M54 106 L40 106 M180 92 L190 82 M186 106 L200 106 M66 80 L62 66 M174 80 L178 66"/></g>
<g class="head">
<path class="ear" d="M76 58 L92 92 L102 80 C96 76 90 72 76 58Z" fill="#6b7480" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
<path class="ear" d="M164 58 L148 92 L138 80 C144 76 150 72 164 58Z" fill="#6b7480" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M82 64 L94 86 L100 82Z M158 64 L146 86 L140 82Z" fill="#c9a27e"/>
<path d="M88 84 C100 76 140 76 152 84 L158 112 C152 124 140 136 128 150 L120 160 L112 150 C100 136 88 124 82 112Z" fill="#8a939e" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M98 112 C108 108 132 108 142 112 L136 132 C130 140 110 140 104 132Z" fill="#e3e6ea"/>
<ellipse class="glow" cx="105" cy="106" rx="12" ry="7" fill="#f5c400" opacity=".5"/><ellipse class="glow" cx="135" cy="106" rx="12" ry="7" fill="#f5c400" opacity=".5"/>
<path class="eye" d="M98 102 L112 108 L100 110Z" fill="#f5c400" stroke="#111" stroke-width="1.5"/><path class="eye" d="M142 102 L128 108 L140 110Z" fill="#f5c400" stroke="#111" stroke-width="1.5"/>
<path d="M114 128 L126 128 L120 136Z" fill="#111"/>
<g class="fang"><path d="M108 138 C114 142 126 142 132 138" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<path d="M110 138 L113 147 L116 139 M124 139 L127 147 L130 138" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></g>

</g>
<g class="ball"><circle cx="120" cy="174" r="10" fill="#d7f34a" stroke="#111" stroke-width="2"/><path d="M111 170 C116 175 124 175 129 170 M111 178 C116 173 124 173 129 178" fill="none" stroke="#fff" stroke-width="2"/></g>
</g>
<circle cx="120" cy="120" r="106" fill="none" stroke="#f5c400" stroke-width="3"/>
<text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="3" fill="#dcdcdc"><textPath href="#arc" startOffset="50%" text-anchor="middle">MAVERICKS</textPath></text>
</svg>