<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Patience &amp; Placement logo, animated">
<style>
.hand{transform-box:view-box;transform-origin:70px 146px;animation:hand 4s linear infinite}
@keyframes hand{to{transform:rotate(360deg)}}
.r{transform-box:view-box;transform-origin:72px 104px;animation:r 4s cubic-bezier(.5,0,.3,1) infinite}
@keyframes r{0%,16%{transform:rotate(0)}24%{transform:rotate(-24deg)}29%{transform:rotate(22deg)}36%{transform:rotate(10deg)}50%,100%{transform:rotate(0)}}
.ball{offset-path:path("M62 74 C100 30 160 60 182 154");offset-rotate:0deg;animation:ball 4s linear infinite;opacity:0}
@keyframes ball{0%,27%{offset-distance:0%;opacity:0}28%{offset-distance:0%;opacity:1}38%{offset-distance:30%}50%{offset-distance:62%}60%{offset-distance:86%}66%{offset-distance:100%;opacity:1}88%{offset-distance:100%;opacity:1}94%,100%{offset-distance:100%;opacity:0}}
.trail{stroke-dasharray:4 5;animation:trail 4s linear infinite;opacity:0}
@keyframes trail{0%,28%{opacity:0}34%,88%{opacity:.9}94%,100%{opacity:0}}
.cross{transform-box:view-box;transform-origin:182px 154px;animation:cross 4s cubic-bezier(.3,0,.3,1) infinite}
@keyframes cross{0%,30%{transform:scale(2.2) rotate(90deg);opacity:0}36%{opacity:.6}62%{transform:scale(1) rotate(0);opacity:1}66%{transform:scale(1.15);opacity:1}70%,88%{transform:scale(1);opacity:1}94%,100%{transform:scale(1);opacity:0}}
.cc{animation:cc 4s linear infinite}
@keyframes cc{0%,60%{stroke:#ffffff}62%,90%{stroke:#e53935}100%{stroke:#ffffff}}
.flash{transform-box:view-box;transform-origin:182px 154px;animation:flash 4s ease-out infinite;opacity:0}
@keyframes flash{0%,65%{opacity:0;transform:scale(.3)}67%{opacity:1}80%,100%{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.ball{offset-distance:100%;opacity:1}.trail{opacity:.9}.flash{opacity:0}.cc{stroke:#e53935}}
</style>
<defs>
<g id="h"><circle cx="-16" cy="-24" r="4.3"/><circle cx="0" cy="-24" r="4.3"/><circle cx="16" cy="-24" r="4.3"/><circle cx="-24" cy="-8" r="4.3"/><circle cx="-8" cy="-8" r="4.3"/><circle cx="8" cy="-8" r="4.3"/><circle cx="24" cy="-8" r="4.3"/><circle cx="-16" cy="8" r="4.3"/><circle cx="0" cy="8" r="4.3"/><circle cx="16" cy="8" r="4.3"/><circle cx="-8" cy="24" r="4.3"/><circle cx="8" cy="24" r="4.3"/></g>
<path id="arc" d="M28 120 A92 92 0 0 0 212 120" fill="none"/>
<clipPath id="clip"><circle cx="120" cy="120" r="104"/></clipPath>
</defs>
<circle cx="120" cy="120" r="116" fill="#123a5a"/>
<g clip-path="url(#clip)"><g transform="translate(0 -18)">
<path d="M40 60 L200 60 L214 176 L26 176Z" fill="#1e5aa8" stroke="#e9edf1" stroke-width="2.5"/>
<path d="M120 60 L120 176 M34 120 L206 120" stroke="#e9edf1" stroke-width="2"/>
<path class="trail" d="M62 74 C100 30 160 60 182 154" fill="none" stroke="#d7f34a" stroke-width="2.5"/>
<circle class="flash" cx="182" cy="154" r="14" fill="none" stroke="#ffd54f" stroke-width="4"/>
<g class="cross"><g class="cc" fill="none" stroke="#e53935" stroke-width="3.5" stroke-linecap="round">
<circle cx="182" cy="154" r="18"/><path d="M182 124 L182 142 M182 166 L182 184 M152 154 L170 154 M194 154 L212 154"/></g><circle cx="182" cy="154" r="3" fill="#e53935"/></g>
<g class="ball"><circle r="10" fill="#d7f34a" stroke="#111" stroke-width="2"/><path d="M-9 -4 C-3 1 3 1 9 -4 M-9 4 C-3 -1 3 -1 9 4" fill="none" stroke="#fff" stroke-width="1.8"/></g>
<g class="r"><g transform="translate(58 82) rotate(-30) scale(.6)"><ellipse rx="22" ry="27" fill="#e9edf1" stroke="#000" stroke-width="2.5"/><g fill="#123a5a" transform="scale(.75)"><use href="#h"/></g><rect x="-5" y="26" width="10" height="26" rx="3" fill="#d7f34a" stroke="#000" stroke-width="2"/></g></g>
<g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="70" cy="146" r="13"/><path class="hand" d="M70 146 L70 137"/><path d="M70 146 L76 149"/></g>
</g></g>
<circle cx="120" cy="120" r="106" fill="none" stroke="#e53935" stroke-width="3"/>
<text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" fill="#e9edf1"><textPath href="#arc" startOffset="50%" text-anchor="middle">PATIENCE &amp; PLACEMENT</textPath></text>
</svg>