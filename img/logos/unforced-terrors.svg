<g transform="translate(-24 10)"><g class="ghost"><path d="M150 72 L150 40 C150 24 160 16 172 16 C184 16 194 24 194 40 L194 72 L187 66 L180 72 L172 66 L165 72 L158 66Z" fill="#eef2f7" stroke="#9aa8c4" stroke-width="2"/>
