<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Unforced Terrors logo"><style>
.ball{animation:ball 4s linear infinite;opacity:0}
@keyframes ball{0%,2%{transform:translate(14px,150px) scale(1.2);opacity:0}5%{opacity:1}18%{transform:translate(104px,118px) scale(.9)}19.5%{transform:translate(106px,118px) scale(.75,1.15)}23%{transform:translate(98px,126px) scale(.9)}30%{transform:translate(94px,140px)}33%{transform:translate(92px,144px) scale(1.1,.85)}36%{transform:translate(90px,136px) scale(.9);opacity:1}42%,100%{transform:translate(88px,144px);opacity:0}}
.err{animation:err 4s steps(1) infinite}
@keyframes err{0%,18%{opacity:.15}19%,22%{opacity:1}23%,26%{opacity:.2}27%,30%{opacity:1}31%,34%{opacity:.2}35%,92%{opacity:1}96%,100%{opacity:.15}}
.shift{animation:shift 4s ease-in-out infinite}
@keyframes shift{0%,44%{transform:translateX(-11px)}52%,100%{transform:translateX(0)}}
.t{transform-box:fill-box;transform-origin:50% 50%;animation:tflip 4s ease-out infinite;opacity:0}
@keyframes tflip{0%,50%{opacity:0;transform:scaleY(0)}53%{opacity:1;transform:scaleY(1.3)}57%,92%{opacity:1;transform:scaleY(1)}96%,100%{opacity:0}}
.ghost{animation:ghost 4s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes ghost{0%,56%{transform:translateY(48px)}64%{transform:translateY(0) rotate(-4deg)}70%{transform:translateY(-4px) rotate(5deg)}76%{transform:translateY(0) rotate(-4deg)}82%{transform:translateY(-3px) rotate(3deg)}88%{transform:translateY(0)}94%,100%{transform:translateY(48px)}}
.ghost{transform-box:view-box;transform-origin:172px 60px}
.boo{transform-box:fill-box;transform-origin:50% 50%;animation:boo 4s ease-out infinite;opacity:0}
@keyframes boo{0%,62%{opacity:0;transform:scale(.3)}66%{opacity:1;transform:scale(1.25)}70%,86%{opacity:1;transform:scale(1)}90%,100%{opacity:0}}
.ghost .eye{animation:eye 4s linear infinite}@keyframes eye{0%,66%{fill:#111}67%,84%{fill:#ff1744}85%,100%{fill:#111}}
.flash{animation:flash 4s linear infinite;opacity:0}@keyframes flash{0%,52%{opacity:0}54%{opacity:.6}64%,100%{opacity:0}}
.hit{animation:hit 4s linear infinite;opacity:0}@keyframes hit{0%,18%{opacity:0}19.5%{opacity:1}25%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-delay:-2.8s!important;animation-play-state:paused!important}}
*{animation-delay:-2.8s!important;animation-play-state:paused!important}
