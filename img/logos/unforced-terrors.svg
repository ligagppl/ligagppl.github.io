<path d="M150 46 C142 44 138 38 140 32 M194 46 C202 44 206 38 204 32" fill="none" stroke="#eef2f7" stroke-width="6" stroke-linecap="round"/></g></g>
<path d="M64 132 L64 150 M176 132 L176 150" stroke="#455a64" stroke-width="5"/>
<rect x="40" y="62" width="160" height="70" rx="8" fill="#000" stroke="#455a64" stroke-width="4"/>
<rect class="flash" x="44" y="66" width="152" height="62" rx="5" fill="#ff1744"/>
<text x="120" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#90a4ae" letter-spacing="3">UNFORCED</text>
<g font-family="Courier New, monospace" font-weight="700" font-size="34" fill="#ff1744" letter-spacing="2">
<text class="t" x="53" y="114">T</text>
