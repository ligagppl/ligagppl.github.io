<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Sheesha Torr logo"><style>
*{animation-delay:-2.0s!important;animation-play-state:paused!important}.crk{transform-box:view-box;animation:crk 3.2s cubic-bezier(.2,1,.3,1) infinite;opacity:0}
.sh{transform-box:fill-box;transform-origin:50% 50%;animation:sh 3.2s ease-out infinite;opacity:0}
@keyframes sh{0%,40%{opacity:0;transform:translate(0,0) rotate(0)}42%{opacity:1}58%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{opacity:0}}
.fl{animation:fl 3.2s linear infinite;opacity:0}@keyframes fl{0%,40%{opacity:0}41.5%{opacity:1}48%,100%{opacity:0}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.sh,.fl{opacity:0}.crk{opacity:1}}
.crk{transform-origin:120px 92px}
@keyframes crk{0%,40%{opacity:0;transform:scale(.1)}42%{opacity:1}50%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1)}}
.r{transform-box:view-box;transform-origin:58px 160px;animation:r 3.2s cubic-bezier(.5,0,.3,1) infinite}
@keyframes r{0%,14%{transform:rotate(0)}22%{transform:rotate(-26deg)}27%{transform:rotate(30deg)}34%{transform:rotate(16deg)}50%,100%{transform:rotate(0)}}
.ball{animation:ball 3.2s linear infinite}
@keyframes ball{0%,4%{transform:translate(124px,110px) scale(.5);opacity:0}8%{opacity:1;transform:translate(118px,96px) scale(.6)}16%{transform:translate(98px,58px) scale(.95)}26%{transform:translate(64px,112px) scale(1.4)}40%{transform:translate(120px,92px) scale(.55)}41%{transform:translate(120px,92px) scale(.62,.45)}52%{transform:translate(118px,138px) scale(.55)}56%{transform:translate(116px,128px) scale(.55)}60%{transform:translate(114px,138px) scale(.55);opacity:1}70%,100%{transform:translate(112px,138px) scale(.55);opacity:0}}
</style><defs><g id="h"><circle cx="-16" cy="-24" r="4.3"/><circle cx="0" cy="-24" r="4.3"/><circle cx="16" cy="-24" r="4.3"/><circle cx="-24" cy="-8" r="4.3"/><circle cx="-8" cy="-8" r="4.3"/><circle cx="8" cy="-8" r="4.3"/><circle cx="24" cy="-8" r="4.3"/><circle cx="-16" cy="8" r="4.3"/><circle cx="0" cy="8" r="4.3"/><circle cx="16" cy="8" r="4.3"/><circle cx="-8" cy="24" r="4.3"/><circle cx="8" cy="24" r="4.3"/></g>
