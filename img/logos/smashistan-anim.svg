<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Smashistan logo, animated">
<style>
.in{offset-path:path("M102 4 C102 40 96 70 90 92");offset-rotate:0deg;animation:in 3.6s linear infinite;opacity:0}
@keyframes in{0%,3%{offset-distance:0%;opacity:0}7%{opacity:1;offset-distance:8%}23%{offset-distance:100%;opacity:1}23.5%,100%{offset-distance:100%;opacity:0}}
.out{offset-path:path("M90 92 L104 150 C120 30 168 14 184 100");offset-rotate:0deg;animation:out 3.6s linear infinite;opacity:0}
@keyframes out{0%,23%{offset-distance:0%;opacity:0}23.5%{offset-distance:0%;opacity:1}25%{offset-distance:22%;transform:scale(1)}26%{offset-distance:23%;transform:scale(1.35,.65)}27%{offset-distance:28%;transform:scale(1)}33%{offset-distance:64%}40%{offset-distance:100%}42%{offset-distance:100%;transform:scale(1.3,.7)}45%{transform:scale(1)}88%{offset-distance:100%;opacity:1}95%,100%{offset-distance:100%;opacity:0}}
.trail{stroke-dasharray:4 6;animation:trail 3.6s linear infinite;opacity:0}@keyframes trail{0%,24%{opacity:0}30%,88%{opacity:.9}95%,100%{opacity:0}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.r{transform-box:view-box;transform-origin:70px 128px;animation:r 3.6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes r{0%,12%{transform:rotate(0)}19%{transform:rotate(-30deg)}23%{transform:rotate(26deg)}27%{transform:rotate(12deg)}38%,100%{transform:rotate(0)}}
.hit{animation:hit 3.6s linear infinite;opacity:0}@keyframes hit{0%,22.5%{opacity:0}24%{opacity:1}30%,100%{opacity:0}}
.wave{transform-box:view-box;transform-origin:184px 100px;animation:wave 3.6s ease-out infinite;opacity:0}
.wave.b{animation-delay:.18s}.wave.c{animation-delay:.36s}
@keyframes wave{0%,40%{opacity:0;transform:scale(.4)}42%{opacity:.9}64%,100%{opacity:0;transform:scale(2.6)}}
.echo{transform-box:fill-box;transform-origin:50% 50%;animation:echo 3.6s ease-out infinite;opacity:0}
.echo.b{animation-delay:.22s}.echo.c{animation-delay:.44s}
@keyframes echo{0%,41%{opacity:0;transform:scale(.6)}44%{opacity:1;transform:scale(1.1)}50%{transform:scale(1)}84%{opacity:.9}92%,100%{opacity:0;transform:scale(1)}}
.dust{animation:dust 3.6s linear infinite;opacity:0}@keyframes dust{0%,25%{opacity:0}26%{opacity:1}36%,100%{opacity:0}}
.wv{transform-box:fill-box;transform-origin:0 50%;animation:wv 1.4s ease-in-out infinite}.wv.b{animation-delay:-.7s}@keyframes wv{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(4deg) scaleX(.94)}}
.wl{transform-box:view-box;transform-origin:154px 100px;animation:wave 3.6s ease-out infinite;opacity:0}
.wr{transform-box:view-box;transform-origin:214px 100px;animation:wave 3.6s ease-out infinite;opacity:0}
.wl.b,.wr.b{animation-delay:.18s}.wl.c,.wr.c{animation-delay:.36s}
.land{transform-box:view-box;transform-origin:184px 100px;animation:land 3.6s ease-out infinite;opacity:0}
@keyframes land{0%,39%{opacity:0;transform:scale(.3)}41%{opacity:1}56%,100%{opacity:0;transform:scale(2)}}
.pin{transform-box:fill-box;transform-origin:50% 100%;animation:pin 3.6s ease-out infinite}
@keyframes pin{0%,56%,70%,100%{transform:translateY(0)}60%{transform:translateY(-6px)}64%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.trail{opacity:.9}.out{offset-distance:100%;opacity:1}.hit,.land{opacity:0}}
</style>
