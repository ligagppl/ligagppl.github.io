<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Vibora Vipers logo">
  <defs>
    <g id="h"><circle cx="-16" cy="-24" r="4.2"/><circle cx="0" cy="-24" r="4.2"/><circle cx="16" cy="-24" r="4.2"/><circle cx="-24" cy="-8" r="4.2"/><circle cx="-8" cy="-8" r="4.2"/><circle cx="8" cy="-8" r="4.2"/><circle cx="24" cy="-8" r="4.2"/><circle cx="-16" cy="8" r="4.2"/><circle cx="0" cy="8" r="4.2"/><circle cx="16" cy="8" r="4.2"/><circle cx="-8" cy="24" r="4.2"/><circle cx="8" cy="24" r="4.2"/></g>
    <path id="arc" d="M34 120 A86 86 0 0 0 206 120" fill="none"/>
  </defs>
  <circle cx="120" cy="120" r="116" fill="#0f2a1a"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#3ccf6e" stroke-width="3"/>

  <g transform="translate(33 14) scale(0.72)">
    <!-- snake: coils behind the handle -->
    <g fill="none" stroke-linecap="round">
      <path d="M142 190 C130 180 110 178 100 172" stroke="#14532d" stroke-width="18"/>
      <path d="M142 154 C130 146 110 144 100 138" stroke="#14532d" stroke-width="18"/>
    </g>

    <!-- racket -->
    <ellipse cx="120" cy="72" rx="44" ry="50" fill="#eef3ee" stroke="#0b1f13" stroke-width="3"/>
    <ellipse cx="120" cy="72" rx="36" ry="42" fill="none" stroke="#c9d6cc" stroke-width="2"/>
    <g fill="#0f2a1a" transform="translate(120 72) scale(1.15)"><use href="#h"/></g>
    <path d="M106 118 L134 118 L128 132 L112 132 Z" fill="#eef3ee" stroke="#0b1f13" stroke-width="3"/>
    <rect x="110" y="130" width="20" height="86" rx="6" fill="#eef3ee" stroke="#0b1f13" stroke-width="3"/>

    <!-- snake: coils in front of the handle, then up to the ball -->
    <g fill="none" stroke-linecap="round">
      <path d="M86 208 C102 207 128 202 142 190" stroke="#3ccf6e" stroke-width="18"/>
      <path d="M100 172 C114 168 130 162 142 154" stroke="#3ccf6e" stroke-width="18"/>
      <path d="M100 138 C72 124 62 80 80 42" stroke="#3ccf6e" stroke-width="18"/>
      <path d="M86 208 C102 207 128 202 142 190" stroke="#b9f5cf" stroke-width="4"/>
      <path d="M100 172 C114 168 130 162 142 154" stroke="#b9f5cf" stroke-width="4"/>
      <path d="M100 138 C72 124 62 80 80 42" stroke="#b9f5cf" stroke-width="4"/>
    </g>

    <!-- head biting the ball -->
    <path d="M78 22 C96 14 116 22 116 34 C116 46 98 52 80 46 C68 42 66 26 78 22 Z" fill="#3ccf6e" stroke="#0b1f13" stroke-width="3"/>
    <circle cx="98" cy="28" r="4" fill="#f5c400"/><circle cx="98.8" cy="28" r="1.8" fill="#0b1f13"/>
    <path d="M88 41 L104 39" stroke="#0b1f13" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="136" cy="32" r="19" fill="#d7f34a" stroke="#0b1f13" stroke-width="3"/>
    <path d="M119 25 C129 32 143 32 154 25 M119 39 C129 32 143 32 154 39" fill="none" stroke="#fff" stroke-width="3"/>
  </g>

  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="3" fill="#dcdcdc">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">VIBORA VIPERS</textPath>
  </text>
</svg>
