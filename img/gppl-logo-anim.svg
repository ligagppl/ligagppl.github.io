<style>.l1ra{transform-box:view-box;transform-origin:110px 150px;animation:l1ra 2s ease-out infinite}@keyframes l1ra{0%{transform:rotate(-5deg)}6%{transform:rotate(3deg)}20%,90%{transform:rotate(0)}100%{transform:rotate(-5deg)}}
.l1rb{transform-box:view-box;transform-origin:130px 150px;animation:l1rb 2s ease-out infinite}@keyframes l1rb{0%,40%{transform:rotate(0)}50%{transform:rotate(5deg)}56%{transform:rotate(-3deg)}70%,100%{transform:rotate(0)}}
.l1rally{offset-path:path('M62 26 Q120 -2 178 26 Q120 -2 62 26');offset-rotate:0deg;animation:l1rally 2s infinite}
