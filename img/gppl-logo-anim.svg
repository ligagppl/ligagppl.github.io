.l1st{transform-box:fill-box;transform-origin:50% 50%;animation:l1st 1.5s ease-in-out infinite}@keyframes l1st{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(36deg)}}
.shine{animation:shine 3s ease-in-out infinite}@keyframes shine{0%,35%{transform:translateX(-80px)}75%,100%{transform:translateX(560px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.l1rally{opacity:0}}
</style>
