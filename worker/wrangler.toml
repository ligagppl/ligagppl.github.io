# GPPL member area – gatekeeper
# Secrets (set with `npx wrangler secret put NAME --env staging`, never in this file):
#   GITHUB_TOKEN   fine-grained token: this repository only, Contents read & write
#   SESSION_SECRET long random text (signs logins, salts team codes)
#   ADMIN_KEY      long random text (entered once in Admin → Member area)
#   TURNSTILE_SECRET  secret key of the Turnstile widget (login security check)

name = "gppl-members"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
GH_OWNER = "ligagppl"
GH_REPO = "ligagppl.github.io"
GH_BRANCH = "main"
ALLOWED_ORIGINS = "https://ligagppl.github.io"

[triggers]
crons = ["17 * * * *"]

# KV namespace id is filled in after `npx wrangler kv namespace create KV`
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_PROD_KV_ID"

# login protection: Cloudflare rate limiter (10 tries a minute per connection) + login guard
[[ratelimits]]
name = "LOGIN_RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[durable_objects.bindings]]
name = "GUARD"
class_name = "LoginGuard"

[[durable_objects.bindings]]
name = "PENDING"
class_name = "PendingStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoginGuard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PendingStore"]

# ---------------------------------------------------------------- staging
[env.staging]
name = "gppl-members-staging"

[env.staging.vars]
GH_OWNER = "ligagppl"
GH_REPO = "ligagppl.github.io"
GH_BRANCH = "staging"
ALLOWED_ORIGINS = "https://gppl-staging.pages.dev,http://localhost:8765"

[env.staging.triggers]
crons = ["17 * * * *"]

[[env.staging.kv_namespaces]]
binding = "KV"
id = "ab56eec100464561bbab09ef9a4b9567"

[[env.staging.ratelimits]]
name = "LOGIN_RL"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "GUARD"
class_name = "LoginGuard"

[[env.staging.durable_objects.bindings]]
name = "PENDING"
class_name = "PendingStore"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["LoginGuard"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["PendingStore"]
